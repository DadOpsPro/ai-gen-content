name: LinkedIn — Approve & Post

on:
  # Triggered by approve.html via GitHub API when you click Approve/Skip in email
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug to approve or reject"
        required: true
        type: string
      action:
        description: "approve or reject"
        required: true
        default: "approve"
        type: choice
        options:
          - approve
          - reject

  # Also runs at 8am CT (13:00 UTC) Mon–Fri to post any approved articles
  schedule:
    - cron: "0 13 * * 1-5"

permissions:
  contents: write

jobs:
  # ── JOB 1: Handle approval / rejection click from email ───────────────────
  handle-approval:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Queue files are committed to master — no cache needed.
      - name: Apply approval decision
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL:          ${{ secrets.SITE_URL }}
        run: |
          python -m pipeline.linkedin ${{ github.event.inputs.action }} ${{ github.event.inputs.slug }}

      - name: Commit updated queue file
        run: |
          git config user.name  "AI Dev Defense Bot"
          git config user.email "chris@aidevdefense.com"
          git add linkedin_queue/
          git diff --staged --quiet || git commit -m "LinkedIn: ${{ github.event.inputs.action }} ${{ github.event.inputs.slug }}"
          git push

  # ── JOB 2: Post approved articles at 8am CT ───────────────────────────────
  post-to-linkedin:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Queue files are committed to master by handle-approval — no cache needed.
      - name: Post approved articles to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN:      ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_PERSON_URN:   ${{ secrets.LINKEDIN_PERSON_URN }}
          SITE_URL:              ${{ secrets.SITE_URL }}
        run: python -m pipeline.linkedin post

      - name: Commit updated queue file
        run: |
          git config user.name  "AI Dev Defense Bot"
          git config user.email "chris@aidevdefense.com"
          git add linkedin_queue/
          git diff --staged --quiet || git commit -m "LinkedIn: posted scheduled articles"
          git push