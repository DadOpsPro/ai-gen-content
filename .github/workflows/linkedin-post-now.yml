name: LinkedIn — Post Now (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-to-linkedin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post approved articles to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN:      ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_PERSON_URN:   ${{ secrets.LINKEDIN_PERSON_URN }}
          SITE_URL:              ${{ secrets.SITE_URL }}
        run: python -m pipeline.linkedin post

      - name: Commit updated queue file
        run: |
          git config user.name  "AI Dev Defense Bot"
          git config user.email "chris@aidevdefense.com"
          git add linkedin_queue/
          git diff --staged --quiet || git commit -m "LinkedIn: posted scheduled articles"
          git pull --rebase origin master
          git push